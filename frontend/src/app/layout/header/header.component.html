<header class="app-header d-flex align-items-center px-4">

  <!-- Toggle Sidebar Button -->
  <button class="btn btn-link text-dark p-0 me-3"
          (click)="onToggleSidebar()">
    <i class="bi bi-list fs-4"></i>
  </button>

  <!-- Spacer -->
  <div class="flex-grow-1"></div>

  <!-- User Dropdown -->
  <div class="dropdown">
    <button class="btn btn-link text-dark text-decoration-none dropdown-toggle d-flex align-items-center"
            data-bs-toggle="dropdown">
      <div class="avatar me-2">
        <i class="bi bi-person-circle fs-5"></i>
      </div>
      <span class="fw-semibold">{{ currentUser?.name }}</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end">
      <li>
        <span class="dropdown-item-text text-muted small">
          {{ currentUser?.email }}
        </span>
      </li>
      <li><hr class="dropdown-divider"></li>
      <li>
        <a class="dropdown-item text-danger" (click)="onLogout()">
          <i class="bi bi-box-arrow-right me-2"></i>Logout
        </a>
      </li>
    </ul>
  </div>

</header>
